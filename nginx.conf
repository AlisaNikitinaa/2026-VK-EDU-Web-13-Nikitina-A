user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    gzip on;
    gzip_types text/plain text/css application/javascript image/jpeg image/png image/gif;
    gzip_min_length 256;

    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=my_cache:10m max_size=100m inactive=60m;

    upstream django {
        server web:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # Загруженные пользователями файлы (приоритет выше статики)
        location /uploads/ {
            alias /askme/media/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        # Статические файлы
        location ~* \.(js|css|jpeg|jpg|png|gif|ico|svg|woff|woff2)$ {
            root /askme/static;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }

        # Все остальное — на gunicorn
        location / {
            proxy_pass http://django;
            proxy_cache my_cache;
            proxy_cache_valid 200 10m;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    server {
        listen 8081;
        location / {
            proxy_pass http://simple_wsgi:8081;
        }
    }
}