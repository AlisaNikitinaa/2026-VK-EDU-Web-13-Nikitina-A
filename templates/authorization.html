{% extends 'layouts/base.html' %}
{% load static %}

{% block title %}Log In | AskPupkin{% endblock %}

{% block questions_header %}{% endblock %}

{% block content %}
<div class="login-form-container">
    <div class="login-form">
        <h2>Log In</h2>
        {% if error %}
        <p class="error-message">Sorry, wrong password!</p>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>Login</label>
                <input type="text" name="username" placeholder="Enter your login here" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="**********" required>
            </div>
            <div><h3><a href="{% url 'registration' %}" class="create-account">Create new account</a></h3></div>
            <div class="form-buttons">
                <button type="submit" class="login-btn">Log in!</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
