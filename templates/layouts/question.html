{% load static %}
<article class="question-card">
    <div class="question-header">
        <div class="avatar small">
            <img src="{% static 'img/ask2.jpg' %}" alt="avatar">
        </div>
        <h2 class="question-title">
            <a href="{% url 'one_question' question.id %}">{{ question.title }}</a>
        </h2>
    </div>
    <p class="question-text">{{ question.text|truncatechars:150 }}</p>
    <div class="question-meta">
        <div class="likes-counter">
            <button class="like-up">▲</button>
            <span class="likes-count">{{ question.likes }}</span>
            <button class="like-down">▼</button>
        </div>
        <span class="answers">
            <a href="{% url 'one_question' question.id %}">answer ({{ question.answers }})</a>
        </span>
        <span class="tags">Tags: 
            {% for tag in question.tags %}
                <a href="{% url 'tag' tag_name=tag %}">{{ tag }}</a>{% if not forloop.last %}, {% endif %}
            {% endfor %}
        </span>
    </div>
</article>
