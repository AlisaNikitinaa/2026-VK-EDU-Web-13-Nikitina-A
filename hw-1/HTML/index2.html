<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AskPupkin</title>
    <meta name="author" content="2026-VK-EDU-Web-13-Nikitina-A">
    <link rel="stylesheet" href="../CSS/my2.css">
</head>
<body>
     <header class="header">
            <div class="container">
                <div class="header-top">
                    <h1 class="logo">AskPupkin</h1>
                    <div class="search-section">
                        <input type="text" class="search-input" placeholder="🔍Search">
                    </div>
                    <div class="user-section">
                        <button class="ask-btn">ASK!</button>
                        <div class="user-info">
                            <div class="avatar"><img src="IMG/ask1.jpg" alt="Avatar"></div>
                            <span class="username">Dr. Pepper</span>
                        </div>
                        <div class="user-links">
                            <a href="#" class="settings">Register</a>
                            <span class="separator">|</span>
                            <a href="#" class="login-link">Log in</a>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <main class="main-content">
            <div class="container">
                <div class="content-wrapper">
                    <div class="new-question-section">
                        <form class="new-question-form">
                            <h2 class="form-title">New Question</h2>

                            <label for="title">Title</label>
                            <input type="text" id="title" name="title" placeholder="How to build a moon park?" class="form-input">

                            <label for="text">Text</label>
                            <textarea id="text" name="text" rows="5" placeholder="Really, how?&#10;Have no idea about it" class="form-textarea"></textarea>

                            <label for="tags">Tags</label>
                            <input type="text" id="tags" name="tags" placeholder="moon, park, puzzle" class="form-input">

                            <button type="submit" class="ask-btn form-submit">ASK!</button>
                        </form>
                    </div>

                    <aside class="sidebar">
                        <section class="popular-tags">
                            <h3>Popular Tags</h3>
                            <div class="tags-cloud">
                                <a href="#">perl</a>
                                <a href="#">python</a>
                                <a href="#">TechnoPark</a>
                                <a href="#">MySQL</a>
                                <a href="#">django</a>
                                <a href="#">Mail.Ru</a>
                                <a href="#">Voloshin</a>
                                <a href="#">Firefox</a>
                            </div>
                        </section>

                        <section class="best-members">
                            <h3>Best Members</h3>
                            <ul class="members-list">
                                <li><a href="#">Mr. Freeman</a></li>
                                <li><a href="#">Dr. House</a></li>
                                <li><a href="#">Bender</a></li>
                                <li><a href="#">Queen Victoria</a></li>
                                <li><a href="#">V.Pupkin</a></li>
                            </ul>
                        </section>
                    </aside>
                </div>
            </div>
        </main>
</body>
</html>
