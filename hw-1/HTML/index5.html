<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>AskPupkin</title>
        <meta name="author" content="2026-VK-EDU-Web-13-Nikitina-A">
        <link rel="stylesheet" href="../CSS/my5.CSS">
        </head>
    <body>
       <header class="header">
    <div class="header-container">
        <div class="header-top">
            <h1 class="logo">AskPupkin</h1>
            <div class="search-section">
                <input type="text" class="search-input" placeholder="🔍Search">
            </div>
            <div class="user-section">
                <button class="ask-btn">ASK!</button>
                <div class="user-info">
                    <div class="avatar"><img src="IMG/ask1.jpg" alt="Avatar"></div>
                    <span class="username">Dr. Pepper</span>
                </div>
                <div class="user-links">
                    <a href="#" class="settings">Settings</a>
                    <span class="separator">|</span>
            <a href="#" class="login-link">Log out</a>
                </div>
            </div>
        </div>
    </div>
</header>

        <main class="main-content">
    <div class="container">

            <!-- Форма настроек слева -->
            <div class="settings-form">
                <h2>Settings: Dr. Pepper</h2>
                <form>
                    <div class="form-group">
                        <label>Login</label>
                        <input type="text" value="dr_pepper" readonly>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" value="drpepper@mail.ru">
                    </div>
                    <div class="form-group">
                        <label>NickName</label>
                        <input type="text" value="Dr. Perpper">
                    </div>
                    <div class="form-group upload-avatar">
                        <label>Upload avatar</label>
                        <div class="avatar-preview">
                            <img src="avatar.png" alt="Current avatar">
                        </div>
                        <input type="file" id="avatar-file" style="display: none;">
                        <button type="button" onclick="document.getElementById('avatar-file').click()">Choose</button>
                        <span>c:\avatar.jpg</span>
                    </div>
                    <button type="submit" class="save-btn">Save</button>
                </form>
            </div>

            <!-- Популярные теги и лучшие участники справа -->
            <aside class="sidebar-settings">
                <section class="popular-tags">
                    <h3>Popular Tags</h3>
                    <div class="tags-cloud">
                        <a href="#">perl</a>
                        <a href="#">python</a>
                        <a href="#">TechnoPark</a>
                        <a href="#">MySQL</a>
                        <a href="#">django</a>
                        <a href="#">Mail.Ru</a>
                        <a href="#">Voloshin</a>
                        <a href="#">Firefox</a>
                    </div>
                </section>

                <section class="best-members">
                    <h3>Best Members</h3>
                    <ul class="members-list">
                        <li><a href="#">Mr. Freeman</a></li>
                        <li><a href="#">Dr. House</a></li>
                        <li><a href="#">Bender</a></li>
                        <li><a href="#">Queen Victoria</a></li>
                        <li><a href="#">V.Pupkin</a></li>
                    </ul>
                </section>
            </aside>
        </div>
    </div>
</main>

        <footer class="page-footer">
            <div class="container">
                <div class="pagination">
                    <a href="#" class="page active">1</a>
                    <a href="#" class="page">2</a>
                    <a href="#" class="page">3</a>
                    <span class="dots">...</span>
                    <a href="#" class="page">53</a>
                </div>
            </div>
        </footer>


    </body>
</html>
